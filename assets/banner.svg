<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .pulse-circle {
      animation: pulse 3s infinite alternate ease-in-out;
    }
    .float-badge {
      animation: float 5s infinite alternate ease-in-out;
    }
    .neon-path {
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: drawLine 6s ease-out forwards;
    }
    .ticker-pulse {
      animation: blink 2s infinite ease-in-out;
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0% { r: 5; opacity: 0.7; }
      100% { r: 9; opacity: 1; filter: drop-shadow(0 0 8px #34d399); }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Decorative Chart Area Background -->
  <path d="M 500 320 Q 650 260, 750 290 T 950 180 T 1150 130 L 1150 360 L 500 360 Z" fill="url(#areaGrad)"/>
  <path class="neon-path" d="M 500 320 Q 650 260, 750 290 T 950 180 T 1150 130" fill="none" stroke="url(#lineGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Pulse Points on Line Chart -->
  <circle cx="500" cy="320" r="6" fill="#10b981" class="pulse-circle"/>
  <circle cx="750" cy="290" r="6" fill="#38bdf8" class="pulse-circle"/>
  <circle cx="950" cy="180" r="6" fill="#60a5fa" class="pulse-circle"/>
  <circle cx="1150" cy="130" r="7" fill="#a78bfa" class="pulse-circle"/>

  <!-- Candlesticks on Right -->
  <g opacity="0.65" transform="translate(20, 0)">
    <line x1="820" y1="210" x2="820" y2="310" stroke="#10b981" stroke-width="2"/>
    <rect x="813" y="230" width="14" height="60" rx="2" fill="#10b981"/>

    <line x1="860" y1="230" x2="860" y2="330" stroke="#ef4444" stroke-width="2"/>
    <rect x="853" y="250" width="14" height="45" rx="2" fill="#ef4444"/>

    <line x1="900" y1="170" x2="900" y2="280" stroke="#10b981" stroke-width="2"/>
    <rect x="893" y="190" width="14" height="70" rx="2" fill="#10b981"/>

    <line x1="1020" y1="130" x2="1020" y2="240" stroke="#10b981" stroke-width="2"/>
    <rect x="1013" y="150" width="14" height="65" rx="2" fill="#10b981"/>

    <line x1="1080" y1="90" x2="1080" y2="210" stroke="#10b981" stroke-width="2"/>
    <rect x="1073" y="110" width="14" height="80" rx="2" fill="#10b981"/>
  </g>

  <!-- Left Content: Hero Branding -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#34d399" class="ticker-pulse"/>
    <text x="32" y="21" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1">CURATED PMS ECOSYSTEM</text>

    <text x="0" y="80" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Awesome Portfolio</text>
    <text x="0" y="130" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Management System</text>

    <text x="0" y="175" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Enterprise SaaS Platforms <tspan fill="#38bdf8">•</tspan> Open-Source Engines <tspan fill="#38bdf8">•</tspan> Quant &amp; Wealth Analytics
    </text>

    <g transform="translate(0, 210)">
      <g class="float-badge">
        <rect x="0" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="67" y="23" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">💼 SaaS Platforms</text>
      </g>

      <g class="float-badge" transform="translate(150, 0)">
        <rect x="0" y="0" width="155" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="77" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Open-Source PMS</text>
      </g>

      <g class="float-badge" transform="translate(320, 0)">
        <rect x="0" y="0" width="165" height="36" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="82" y="23" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📊 Quant &amp; Analytics</text>
      </g>
    </g>
  </g>

  <!-- Decorative Border -->
  <rect x="1" y="1" width="1198" height="398" rx="8" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
</svg>
