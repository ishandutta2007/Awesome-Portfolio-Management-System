<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><linearGradient id="areaGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".35"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#34d399"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-width=".75" d="M 40 0 L 0 0 0 40" opacity=".6"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="cardShadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter></defs><style>@keyframes pulse{0%{r:5;opacity:.7}}@keyframes float{0%{transform:translateY(0)}}@keyframes blink{0%{opacity:.3}50%{opacity:1}}.pulse-circle{animation:pulse 3s infinite alternate ease-in-out}.float-badge{animation:float 5s infinite alternate ease-in-out}.neon-path{stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLine 6s ease-out forwards}.ticker-pulse{animation:blink 2s infinite ease-in-out}</style><rect width="1200" height="400" fill="url(#bgGrad)"/><rect width="1200" height="400" fill="url(#grid)"/><path fill="url(#areaGrad)" d="M